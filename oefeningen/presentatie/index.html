# Onderwerp

Het onderwerp waar ik mijn digital garden omheen ga bouwen is dans op camera. Ik ben zelf danser en houd mij steeds meer bezig met de combinatie van film en dans. Ik vind het interessant om mij te verdiepen in dit vakgebied en de culturele impact van dit onderwerp binnen de kunstwereld.

# Introtekst

Dansers en filmmakers werken al samen sinds het begin van de filmkunst. Wat begon als het vastleggen van beweging op beeld, is in de loop der jaren uitgegroeid tot een zelfstandige discipline: screendance.
Nu digitale technologieën zich sneller ontwikkelen, camera's steeds toegankelijker worden en danslessen en -stijlen op veel plekken te volgen zijn, bevindt deze kunstvorm zich in een stroomversnelling. De combinatie van choreografie, cinematografie en montage biedt makers een nieuwe vorm van creatieve vrijheid. Ik vindt dans op camera heel interessant niet alleen omdat ik zelf dans maar omdat ik de combinatie van film, choreografie, mode, belichting en dans heel erg mooi vindt en ik merk dat het een cultureel impact begint te hebben. Ik zie dat er steeds meer 'dans films' worden gemaakt op sociale media en dat grote bedrijven hun producten promoten via een dans reclame.
